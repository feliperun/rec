name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Each native platform runs the unit tests on its own runner; the build
  # matrix below cross-compiles every release target with the same zig.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - run: zig build test
      - name: Transcribe with a local synthetic server
        run: python scripts/e2e_transcribe.py
      - name: Build with synthetic silent input
        run: zig build -Dsilent-input=true --prefix e2e-out
      - name: Record silence and verify warning and closed-stdin pacing
        run: python scripts/e2e_record_silence.py e2e-out/bin/rec${{ runner.os == 'Windows' && '.exe' || '' }}

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: macos-14, target: aarch64-macos, artifact: rec-macos-arm64 }
          - { runs-on: macos-14, target: x86_64-macos, artifact: rec-macos-intel }
          # The gnu ABI and its pinned floor mirror release.yml exactly: CI
          # must compile what ships, or the release is the first build of it.
          - { runs-on: ubuntu-latest, target: x86_64-linux-gnu.2.28, artifact: rec-linux-x64, dynamic: true }
          - { runs-on: ubuntu-latest, target: aarch64-linux-gnu.2.28, artifact: rec-linux-arm64, dynamic: true }
          - { runs-on: windows-latest, target: x86_64-windows, artifact: rec-windows-x64.exe }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - run: zig build -Dtarget=${{ matrix.target }}
      # Static linking costs Linux every audio backend — see the same gate in
      # release.yml. Catching it on the PR keeps it off the release tag.
      - name: Linux build must be dynamically linked
        if: matrix.dynamic
        run: |
          file zig-out/bin/rec
          file zig-out/bin/rec | grep -q "dynamically linked"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: zig-out/bin/

  viewer:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - run: zig build -Dsilent-input=true
      - run: python3 scripts/e2e_viewer.py
      - run: python3 scripts/e2e_playback_notes.py
      - run: python3 scripts/e2e_notes_jobs.py
      - run: python3 scripts/e2e_player.py
