name: quality

on:
  push:
    branches: [main]
  pull_request:

# Structural quality only. Compile + unit tests require macOS (CoreAudio
# frameworks) and run in .github/workflows/ci.yml.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # gate needs the merge base

      - name: Install Sentrux
        env:
          SENTRUX_VERSION: v0.5.7
          # SHA-256 of sentrux-linux-x86_64 for v0.5.7, measured from the
          # release URL below; the asset is replaced under the same tag, so the
          # download is rejected before it is made executable.
          SENTRUX_SHA256: 3237f80fe20d54aad4deefa8a143f0d60543bb5d2d6ad891eb42432f155725a6
        run: |
          mkdir -p "$HOME/.sentrux/bin"
          sentrux="$HOME/.sentrux/bin/sentrux"
          curl -fsSL "https://github.com/sentrux/sentrux/releases/download/${SENTRUX_VERSION}/sentrux-linux-x86_64" \
            -o "$sentrux"
          sha256sum -c - <<EOF
          ${SENTRUX_SHA256}  ${sentrux}
          EOF
          chmod +x "$sentrux"
          echo "$HOME/.sentrux/bin" >> "$GITHUB_PATH"

      - name: Sentrux check (absolute rules)
        run: sentrux check .

      - name: Sentrux gate (no regression)
        if: github.event_name == 'pull_request'
        run: sentrux gate .
