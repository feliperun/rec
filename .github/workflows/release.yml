name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        # Manifest mode: release-please-config.json declares the `simple`
        # type (there is no `zig` type) plus a generic extra-file that bumps
        # `version` in build.zig.zon — the single version source the binary
        # embeds and auto-update compares.
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: macos-14, target: aarch64-macos, artifact: rec-macos-arm64, bin: rec, sanity: true }
          # Rosetta runs the Intel build on the arm64 macOS runner.
          - { runs-on: macos-14, target: x86_64-macos, artifact: rec-macos-intel, bin: rec, sanity: true }
          # Linux names the gnu ABI explicitly: a bare `x86_64-linux` resolves
          # to musl, and a static musl binary cannot dlopen (see the `dynamic`
          # gate below). The pinned 2.28 is the oldest glibc a release
          # supports — Debian 10, RHEL 8 — not whatever the runner ships.
          - { runs-on: ubuntu-latest, target: x86_64-linux-gnu.2.28, artifact: rec-linux-x64, bin: rec, sanity: true, dynamic: true }
          # No emulator on the x64 runner: the staged arm64 binary ships
          # unexecuted. `file` still reads its ELF header, so the linkage gate
          # covers it.
          - { runs-on: ubuntu-latest, target: aarch64-linux-gnu.2.28, artifact: rec-linux-arm64, bin: rec, sanity: false, dynamic: true }
          - { runs-on: windows-latest, target: x86_64-windows, artifact: rec-windows-x64.exe, bin: rec.exe, sanity: true }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      # Releases are always built ReleaseFast: optimized and stripped of
      # safety checks, so the distributed binary stays small.
      - run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}
      # `cp` and `mkdir` (no -p) spell the same in bash and pwsh, and dist is
      # always fresh on a release runner. The glob-free cp matters: rec*
      # also matches rec.pdb on Windows, and pwsh's Copy-Item then stages
      # the PDB under the artifact name.
      - run: mkdir dist
      - run: cp "zig-out/bin/${{ matrix.bin }}" "dist/${{ matrix.artifact }}"
      # miniaudio reaches ALSA and PulseAudio through dlopen at runtime, so a
      # statically linked Linux binary loads no backend at all and falls back
      # to miniaudio's null device: it "records" perfectly timed silence while
      # `about`, `list`, the unit tests and the silent-input E2E all still
      # pass. Runners have no microphone, so linkage is the signal that is
      # actually available here. v3.1.0 shipped mute on Linux without it.
      - name: Linux artifact must be dynamically linked
        if: matrix.dynamic
        run: |
          file "dist/${{ matrix.artifact }}"
          file "dist/${{ matrix.artifact }}" | grep -q "dynamically linked"
      # The staged artifact must itself run before it ships.
      - run: ./dist/${{ matrix.artifact }} about
        if: matrix.sanity
      # Each artifact ships with a sibling <artifact>.sha256 in `sha256sum`
      # text format (lowercase hex, two spaces, basename, LF) so install.sh,
      # install.ps1 and src/update.zig can verify it. python3 is present on all
      # three runner OSes; binary mode keeps the line terminator LF on Windows.
      - name: Generate artifact checksum
        run: |
          python3 -c "import hashlib, os; p = 'dist/${{ matrix.artifact }}'; digest = hashlib.sha256(open(p, 'rb').read()).hexdigest(); open(p + '.sha256', 'wb').write((digest + '  ' + os.path.basename(p) + '\n').encode())"
      - run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "dist/${{ matrix.artifact }}" "dist/${{ matrix.artifact }}.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
